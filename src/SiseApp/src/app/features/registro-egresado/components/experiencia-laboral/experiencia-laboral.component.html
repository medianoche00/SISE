<div class="container-fluid main-container fade-in-content">

  <mat-card class="shadow-sm border-0 section-header mb-4">
    <mat-card-content class="header-content d-flex justify-content-between align-items-center">
      <div>
        <h2 class="text-primary fw-bold mb-1 d-flex align-items-center gap-2">
          <mat-icon>work_history</mat-icon> Experiencia Laboral
        </h2>
        <p class="text-muted m-0">Historial de empleos y cargos desempeñados.</p>
      </div>
      <button mat-raised-button color="primary" (click)="abrirModal()" class="shadow-sm">
        <mat-icon>add</mat-icon> AGREGAR
      </button>
    </mat-card-content>
  </mat-card>

  <div *ngIf="cargando" class="text-center py-5">
    <mat-spinner diameter="40" class="mx-auto"></mat-spinner>
  </div>

  <div *ngIf="!cargando && experiencias.length === 0" class="text-center py-5 text-muted">
    <mat-icon class="display-3 text-secondary opacity-25">folder_off</mat-icon>
    <p class="mt-3">No tienes experiencias registradas aún.</p>
    <button mat-button color="primary" (click)="abrirModal()">Agregar mi primera experiencia</button>
  </div>

  <div class="row gy-4" *ngIf="!cargando && experiencias.length > 0">
    <div class="col-12" *ngFor="let exp of experiencias">
      
      <mat-card class="shadow-sm border-0 experience-card h-100">
        <div class="card-body p-4 d-flex flex-column flex-md-row gap-3">
          
          <div class="d-flex flex-column align-items-center justify-content-start pt-1">
            <div class="icon-box bg-light text-primary rounded-circle d-flex align-items-center justify-content-center" 
                 style="width: 50px; height: 50px;">
              <mat-icon>business_center</mat-icon>
            </div>
            <div class="vr h-100 mt-3 d-none d-md-block text-secondary opacity-25"></div>
          </div>

          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h3 class="fw-bold mb-1 text-dark">{{ exp.cargo }}</h3>
                <h4 class="text-primary mb-2 fw-medium">{{ exp.empresa }}</h4>
              </div>
              
              <div class="text-end">
                <span class="badge bg-soft-primary text-primary border border-primary-subtle px-3 py-2 rounded-pill">
                  {{ exp.fechaInicio | date:'MMM yyyy' }} - 
                  <span *ngIf="exp.actualmente; else fechaFinBlock">Actualidad</span>
                  <ng-template #fechaFinBlock>{{ exp.fechaFin | date:'MMM yyyy' }}</ng-template>
                </span>
              </div>
            </div>

            <p class="text-muted mt-3 mb-0" *ngIf="exp.descripcion">
              {{ exp.descripcion }}
            </p>
          </div>

          <div class="d-flex flex-row flex-md-column gap-2 justify-content-end align-items-center ms-md-3 border-start-md ps-md-3">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="abrirModal(exp)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(exp)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>

        </div>
      </mat-card>

    </div>
  </div>

</div>
