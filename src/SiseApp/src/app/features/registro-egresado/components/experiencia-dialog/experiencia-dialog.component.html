<h2 mat-dialog-title class="fw-bold text-primary">
  <mat-icon class="align-middle me-2">{{ esEdicion ? 'edit' : 'add_business' }}</mat-icon>
  {{ esEdicion ? 'Editar Experiencia' : 'Nueva Experiencia' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="row g-3 pt-3">
    
    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Cargo / Puesto</mat-label>
        <input matInput formControlName="cargo" placeholder="Ej. Analista de Sistemas">
        <mat-icon matSuffix>badge</mat-icon>
      </mat-form-field>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Empresa</mat-label>
        <input matInput formControlName="empresa" placeholder="Ej. Microsoft">
        <mat-icon matSuffix>business</mat-icon>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha Inicio</mat-label>
        <input matInput [matDatepicker]="pickerInicio" formControlName="fechaInicio">
        <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
        <mat-datepicker #pickerInicio></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha Fin</mat-label>
        <input matInput [matDatepicker]="pickerFin" formControlName="fechaFin">
        <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
        <mat-datepicker #pickerFin></mat-datepicker>
      </mat-form-field>
      
      <div class="mt-1">
        <mat-checkbox formControlName="actualmente" color="primary">Trabajo aquí actualmente</mat-checkbox>
      </div>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descripción de funciones (Opcional)</mat-label>
        <textarea matInput formControlName="descripcion" rows="3"></textarea>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-3 pe-3">
  <button mat-button (click)="cerrar()">CANCELAR</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="form.invalid">
    GUARDAR
  </button>
</mat-dialog-actions>
