<h2 mat-dialog-title class="fw-bold text-primary">Ingrese los datos para postular</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="row g-3 pt-3">

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Carta de presentacion</mat-label>
        <input matInput placeholder="" formControlName="cartaPresentacion" />
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cerrar</button>

  <button mat-raised-button color="primary" (click)="ejecutarAccionPrincipal()">
    POSTULAR
  </button>
</mat-dialog-actions>
