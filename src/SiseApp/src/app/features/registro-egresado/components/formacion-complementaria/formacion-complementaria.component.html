<div class="container-fluid fade-in-content main-container">

  <mat-card class="shadow-sm border-0 section-header">
    <mat-card-content class="header-content">

      <div class="row align-items-center">

        <div class="col-md-8">
          <h2 class="text-primary fw-bold mb-1 d-flex align-items-center gap-2">
            <mat-icon>school</mat-icon> Formación Complementaria
          </h2>
          <p class="text-muted m-0">
            Diplomados, cursos, talleres y certificaciones extra.
          </p>
        </div>

        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <button mat-raised-button color="primary" (click)="agregarNueva()" class="px-4 py-2">
            <mat-icon>add</mat-icon> AGREGAR NUEVO
          </button>
        </div>

      </div>

    </mat-card-content>
  </mat-card>

  <div *ngIf="listaFormacion.length > 0" class="training-list">

    <div *ngFor="let item of listaFormacion; let i = index" class="training-wrapper">

      <mat-card class="training-card border-start border-4 border-success shadow-sm">
        <mat-card-content class="training-content">

          <div class="row align-items-center">

            <div class="col-md-9">
              <h3 class="fw-bold text-dark text-uppercase training-title">
                {{ item.institucion }}
              </h3>

              <h4 class="text-success fw-bold training-subtitle">
                {{ item.nombreFormacion }}
              </h4>

              <div class="d-flex flex-wrap align-items-center gap-3 mt-2">

                <span class="badge bg-light text-dark border p-2 fw-normal d-flex align-items-center">
                  <mat-icon class="me-2 small-icon text-muted">date_range</mat-icon>
                  {{ item.fechaInicio | date:'dd/MM/yyyy' }} - {{ item.fechaFin | date:'dd/MM/yyyy' }}
                </span>

                <span *ngIf="item.horas" class="badge bg-light text-dark border p-2 fw-normal d-flex align-items-center">
                  <mat-icon class="me-2 small-icon text-muted">schedule</mat-icon>
                  {{ item.horas }} Horas
                </span>

              </div>
            </div>

            <div class="col-md-3 d-flex justify-content-md-end gap-2 mt-3 mt-md-0 pe-md-2">
              <button mat-stroked-button color="primary" (click)="editar(i, item)">
                <mat-icon>edit</mat-icon> Editar
              </button>
              <button mat-icon-button color="warn" (click)="eliminar(i)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </div>

          </div>

        </mat-card-content>
      </mat-card>

    </div>

  </div>

  <div *ngIf="cargando" class="text-center mt-4">
    <mat-progress-bar mode="indeterminate" class="w-50 mx-auto rounded"></mat-progress-bar>
    <small class="text-muted d-block mt-2">Guardando formación...</small>
  </div>

</div>
