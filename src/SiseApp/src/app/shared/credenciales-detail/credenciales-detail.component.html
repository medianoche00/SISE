<h2 mat-dialog-title>Gestionar Credenciales</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="form">
    <div class="container-fluid p-0">

      <div class="alert alert-info mb-3">
        <mat-icon class="align-middle me-2" style="font-size: 20px;">info</mat-icon>
        <span>Actualice el usuario y establezca una nueva contraseña.</span>
      </div>

      <div class="row">
        <div class="col-12 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" autocomplete="off">
            <mat-error *ngIf="form.get('username')?.hasError('required')">
              El username es requerido
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Nueva Contraseña</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="new-password">

            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Ocultar contraseña'" type="button">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>

            <mat-error *ngIf="form.get('password')?.hasError('required')">
              La contraseña es requerida
            </mat-error>
            <mat-error *ngIf="form.get('password')?.hasError('minlength')">
              Mínimo 6 caracteres
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Documento de Respaldo</mat-label>
            <input matInput formControlName="documentoRespaldo" placeholder="Ej: Memo Nro 123-2024">
            <mat-icon matSuffix>description</mat-icon>
            <mat-error *ngIf="form.get('documentoRespaldo')?.hasError('required')">
              Debe indicar el documento que autoriza el cambio
            </mat-error>
          </mat-form-field>
        </div>

      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pe-3 pb-3">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="isLoading || form.invalid">
    <mat-spinner diameter="20" *ngIf="isLoading" class="me-2 d-inline-block"></mat-spinner>
    Actualizar
  </button>
</mat-dialog-actions>
