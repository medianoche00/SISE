<div class="main-container fade-in-content">
  <mat-card class="shadow-sm border-0 form-card">
    <mat-card-content class="p-4 p-md-5">
      <div class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="fw-bold text-dark border-start border-4 border-secondary ps-3 mb-4">
            Historial de formación académica complementaria.
          </h3>

          <button mat-raised-button color="primary" (click)="abrirModal()">
            <mat-icon>add</mat-icon> AGREGAR
          </button>
        </div>

        <div *ngIf="cargando" class="text-center py-4">
          <mat-spinner diameter="30" class="mx-auto"></mat-spinner>
        </div>

        <div *ngIf="!cargando && listaFormacion.length === 0" class="text-center py-4 text-muted">
          <p>No hay formaciones complementarias registradas.</p>
        </div>

        <div *ngIf="!cargando && listaFormacion.length > 0" class="d-flex flex-column gap-3">

          <mat-card appearance="outlined" class="formacionerience-item" *ngFor="let formacion of listaFormacion">
            <mat-card-content class="p-3">

              <div class="d-flex justify-content-between align-items-start w-100 mb-1" id="header-formacion">

                <span class="fw-bold text-dark">{{ formacion.nombreDelCurso }}</span>
                <span class="spacer"></span>
                <span class="text-muted small fw-medium text-nowrap ms-3 text-end">
                  {{ formacion.fechaInicio | date:'MMM yyyy' }} -
                  {{ formacion.fechaFin | date:'MMM yyyy' }}
                </span>
              </div>

              <div class="text-primary mb-2 fw-medium">
                {{ formacion.institucion }}
              </div>

              <div class="text-muted small mb-3" style="min-height: 20px;">
                {{ formacion.tipoFormacion }}
              </div>

              <div class="d-flex gap-2">
                <button mat-stroked-button color="primary" class="btn-sm-custom" (click)="abrirModal(formacion)">
                  <mat-icon class="icon-sm">edit</mat-icon> Modificar
                </button>

                <button mat-stroked-button color="warn" class="btn-sm-custom" (click)="eliminar(formacion)">
                  <mat-icon class="icon-sm">delete</mat-icon> Eliminar
                </button>
              </div>

            </mat-card-content>
          </mat-card>

        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
