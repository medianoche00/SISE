<div class="container-fluid p-4">

  <mat-card class="mb-4">
    <mat-card-content class="p-3">

      <div class="d-flex flex-wrap gap-3 align-items-center">

        <h3 class="m-0 text-primary me-3" style="font-weight: 700;">Mi Perfil:</h3>

        <button mat-raised-button
                color="primary"
                routerLink="./"
                [routerLinkActiveOptions]="{exact: true}"
                routerLinkActive="btn-activo">
          <mat-icon>person</mat-icon> Datos Personales
        </button>

        <button mat-raised-button
                color="primary"
                routerLink="experiencia"
                routerLinkActive="btn-activo">
          <mat-icon>work</mat-icon> Experiencia Laboral
        </button>

        <button mat-raised-button
                color="primary"
                routerLink="formacion"
                routerLinkActive="btn-activo">
          <mat-icon>school</mat-icon> Formación Compl.
        </button>

      </div>
    </mat-card-content>
  </mat-card>

  <div class="fade-in-content">
    <router-outlet></router-outlet>
  </div>

</div>
