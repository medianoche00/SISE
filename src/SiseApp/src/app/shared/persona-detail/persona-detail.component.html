<h2 mat-dialog-title class="titulo-modal">
  <mat-icon class="me-2">{{ esVer ? 'visibility' : 'person' }}</mat-icon>
  {{ titulo }}
</h2>

<mat-dialog-content class="mat-typography custom-dialog-content">
  <form [formGroup]="form">

    <h6 class="section-title">Datos Personales</h6>
    <div class="row">
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre">
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Apellido Paterno</mat-label>
          <input matInput formControlName="apellidoPaterno">
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Apellido Materno</mat-label>
          <input matInput formControlName="apellidoMaterno">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tipo Documento</mat-label>
          <mat-select formControlName="tipoDocumento">
            <mat-option value="DNI">DNI</mat-option>
            <mat-option value="Pasaporte">Pasaporte</mat-option>
            <mat-option value="CE">Carnet Extranjería</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Número Documento</mat-label>
          <input matInput formControlName="numeroDocumento">
        </mat-form-field>
      </div>
    </div>

    <h6 class="section-title mt-2">Contacto</h6>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="telefono">
          <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput formControlName="correo">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>
      </div>
    </div>

    <h6 class="section-title mt-2">Domicilio</h6>
    <div class="row">
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Departamento</mat-label>
          <input matInput formControlName="departamento">
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Provincia</mat-label>
          <input matInput formControlName="provincia">
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Distrito</mat-label>
          <input matInput formControlName="distrito">
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Dirección Específica</mat-label>
          <input matInput formControlName="direccionEspecifica" placeholder="Av, Calle, Nro...">
          <mat-icon matSuffix>home</mat-icon>
        </mat-form-field>
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-3 pe-3">
  <button mat-stroked-button color="warn" (click)="cerrar()">{{ esVer ? 'Cerrar' : 'Cancelar' }}</button>
  <button mat-raised-button color="primary" (click)="guardar()" *ngIf="!esVer" class="ms-2">
    Guardar
  </button>
</mat-dialog-actions>
