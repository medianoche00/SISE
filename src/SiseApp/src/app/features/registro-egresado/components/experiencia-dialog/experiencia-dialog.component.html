<h2 mat-dialog-title class="mb-3">
  {{ esEdicion ? 'Editar' : 'Nueva' }} Experiencia Laboral
</h2>
  
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-3 pt-2">

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Empresa</mat-label>
      <input matInput formControlName="empresa" placeholder="Nombre de la empresa">
      <mat-error>Campo requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Cargo</mat-label>
      <input matInput formControlName="cargo" placeholder="Puesto desempeñado">
      <mat-error>Campo requerido</mat-error>
    </mat-form-field>

    <div class="d-flex gap-3">
      <mat-form-field appearance="outline" class="w-50">
        <mat-label>Fecha Inicio</mat-label>
        <input matInput type="date" formControlName="fechaInicio">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-50" *ngIf="!form.get('actualmente')?.value">
        <mat-label>Fecha Fin</mat-label>
        <input matInput type="date" formControlName="fechaFin">
      </mat-form-field>
    </div>

    <mat-checkbox formControlName="actualmente" color="primary">
      Trabajo aquí actualmente
    </mat-checkbox>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-2 pb-3 pe-3">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
