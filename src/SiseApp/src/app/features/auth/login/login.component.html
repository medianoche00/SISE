<form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Usuario o correo</mat-label>
        <input matInput formControlName="userNameOrEmail"/>
        <mat-error *ngIf="form.controls['userNameOrEmail'].hasError('required')">Campo requerido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-error *ngIf="form.controls['password'].hasError('required')">Campo requerido</mat-error>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary" type="submit" [disabled]="loading">Entrar</button>
      <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="24"></mat-progress-spinner>
    </mat-card-actions>
  </mat-card>
</form>
