<div class="container mt-4">
  <h2>Gestión de Personas</h2>
  <button class="btn btn-primary mb-3">Nueva Persona</button>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>DNI</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let persona of personas">
        <td>{{ persona.id }}</td>
        <td>{{ persona.nombres }}</td>
        <td>{{ persona.apellidos }}</td>
        <td>{{ persona.dni }}</td>
        <td>{{ persona.email }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="eliminarPersona(persona.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
