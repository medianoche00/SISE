<h2 mat-dialog-title class="fw-bold text-primary">
  <mat-icon class="align-middle me-2">{{ esEdicion ? 'edit' : 'add_business' }}</mat-icon>
  {{ esEdicion ? 'Editar Formacion' : 'Nueva Formacion' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="row g-3 pt-3">

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tipo de Formación</mat-label>
        <!-- <input mat-input formControlName="tipoFormacion" > -->
        <mat-icon matSuffix>badge</mat-icon>
        <mat-select formControlName="tipoFormacion"> <!-- //! cargar desde base de datos -->
          <mat-option value="Curso">Curso</mat-option>
          <mat-option value="Taller">Certificación Internacional</mat-option>
          <mat-option value="Seminario">Maestría</mat-option>
          <mat-option value="Diplomado">Doctorado</mat-option>
          <mat-option value="Otro">Taller</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre del curso</mat-label>
        <input matInput formControlName="nombreDelCurso" placeholder="Ej. Desarrollo Web con Angular">
        <mat-icon matSuffix>book</mat-icon>
      </mat-form-field>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Institución</mat-label>
        <input matInput formControlName="institucion" placeholder="Ej. Universidad Nacional de Piura">
        <mat-icon matSuffix>school</mat-icon>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha Inicio</mat-label>
        <input matInput [matDatepicker]="pickerInicio" formControlName="fechaInicio">
        <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
        <mat-datepicker #pickerInicio></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha Fin</mat-label>
        <input matInput [matDatepicker]="pickerFin" formControlName="fechaFin">
        <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
        <mat-datepicker #pickerFin></mat-datepicker>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-3 pe-3">
  <button mat-button (click)="cerrar()">CANCELAR</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="form.invalid">
    GUARDAR
  </button>
</mat-dialog-actions>
