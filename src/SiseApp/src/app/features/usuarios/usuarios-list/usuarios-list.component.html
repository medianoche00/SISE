<div class="container-fluid p-4 main-container">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="text-primary fw-bold mb-0">Gestión de Usuarios</h2>
      <p class="text-muted m-0">Administra el acceso y roles del sistema.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-0">

      <div class="p-3 border-bottom bg-white d-flex gap-3 align-items-center">
        <div class="search-box flex-grow-1">
          <mat-icon class="search-icon">search</mat-icon>
          <input type="text" placeholder="Buscar por usuario, correo..." (keyup)="aplicarFiltro($event)">
        </div>

        <mat-form-field appearance="outline" class="mb-0 filter-select" style="width: 200px;">
          <mat-label>Filtrar por Rol</mat-label>
          <mat-select (selectionChange)="filtrarPorRol($event.value)">
            <mat-option value="">Todos los Roles</mat-option>
            <mat-option value="Administrador">Administrador</mat-option>
            <mat-option value="Egresado">Egresado</mat-option>
            <mat-option value="Representante">Representante</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" class="w-100">

          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> Usuario </th>
            <td mat-cell *matCellDef="let element" class="fw-bold text-dark">
              <div class="user-info">
                <mat-icon class="user-icon">account_circle</mat-icon> {{element.username}}
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Correo </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
          </ng-container>

          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef> Rol </th>
            <td mat-cell *matCellDef="let element">
              <span class="badge rounded-pill"
                    [ngClass]="{
                  'bg-primary': element.rol === 'Administrador',
                  'bg-success': element.rol === 'Egresado',
                  'bg-warning text-dark': element.rol === 'Representante'
                }">
                {{element.rol}}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef> Estado </th>
            <td mat-cell *matCellDef="let element">
              <span class="badge-dot" [class.active]="element.activo"></span>
              {{ element.activo ? 'Activo' : 'Bloqueado' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="text-end pe-4"> Acciones </th>
            <td mat-cell *matCellDef="let element" class="text-end pe-4">
              <button mat-icon-button color="warn" matTooltip="Bloquear Acceso">
                <mat-icon>block</mat-icon>
              </button>
              <button mat-icon-button class="text-secondary" matTooltip="Reset Password">
                <mat-icon>lock_reset</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover-row"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </div>
</div>
